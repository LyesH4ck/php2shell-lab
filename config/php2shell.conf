ServerName 127.0.0.1

<VirtualHost 127.0.0.1:8088>
    DocumentRoot /var/www/html
    ErrorLog /tmp/php2shell-apache-error.log
    CustomLog /tmp/php2shell-apache-access.log combined
</VirtualHost>

# Idle HTTP/1.1 connections are used only inside the isolated lab to fence
# N-1 prefork children while the calibrated request chain uses the remaining
# worker.  The exploit refreshes and verifies every parked connection before
# and after each stateful request.
KeepAlive On
MaxKeepAliveRequests 100
KeepAliveTimeout 300

<IfModule mpm_prefork_module>
    StartServers ${PHP2SHELL_APACHE_WORKERS}
    # Keep the fixed-size pool full after an exploit-stage worker exits.
    # MaxRequestWorkers remains the hard ceiling, so MaxSpareServers can be
    # one above the largest supported pool without creating an extra child.
    MinSpareServers ${PHP2SHELL_APACHE_WORKERS}
    MaxSpareServers 17
    MaxRequestWorkers ${PHP2SHELL_APACHE_WORKERS}
    MaxConnectionsPerChild 0
</IfModule>
