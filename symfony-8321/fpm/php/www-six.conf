[www]
user = www-data
group = www-data
listen = 9000
listen.owner = www-data
listen.group = www-data
pm = static
pm.max_children = 6
catch_workers_output = yes
decorate_workers_output = no
clear_env = no
security.limit_extensions = .php
access.log = /proc/self/fd/2
access.format = "%R %m %r %s %{milliseconds}dms"

