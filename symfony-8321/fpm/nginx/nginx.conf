worker_processes 1;
error_log /dev/stderr notice;
pid /tmp/nginx.pid;

events {
    worker_connections 256;
}

http {
    access_log /dev/stdout;
    client_body_temp_path /tmp/nginx-client-body;
    fastcgi_temp_path /tmp/nginx-fastcgi;

    upstream php_fpm {
        server fpm-target:9000;
    }

    server {
        listen 8080;
        server_name _;
        # The staging edge returned 413 to Assetnote's first multipart probe.
        # The exact remote threshold is not disclosed by phpinfo; 512 KiB is
        # used here to reproduce that observable rejection deterministically.
        client_max_body_size 512k;

        location = /calibration-hold.php {
            include /etc/nginx/fastcgi_params;
            fastcgi_param SCRIPT_FILENAME /var/www/html/public/calibration-hold.php;
            fastcgi_param DOCUMENT_ROOT /var/www/html/public;
            fastcgi_buffering off;
            fastcgi_pass php_fpm;
            fastcgi_read_timeout 1800s;
        }

        location = /body-leak.php {
            include /etc/nginx/fastcgi_params;
            fastcgi_param SCRIPT_FILENAME /var/www/html/public/body-leak.php;
            fastcgi_param DOCUMENT_ROOT /var/www/html/public;
            fastcgi_buffering off;
            fastcgi_pass php_fpm;
            fastcgi_read_timeout 90s;
        }

        location ~ ^/(?:plain|fpm-index|calibration-hold|body-leak)\.php$ {
            include /etc/nginx/fastcgi_params;
            fastcgi_param SCRIPT_FILENAME /var/www/html/public$fastcgi_script_name;
            fastcgi_param DOCUMENT_ROOT /var/www/html/public;
            fastcgi_pass php_fpm;
            fastcgi_read_timeout 90s;
        }

        location = /proof/shell.php {
            include /etc/nginx/fastcgi_params;
            fastcgi_param SCRIPT_FILENAME /var/www/html/public/proof/shell.php;
            fastcgi_param DOCUMENT_ROOT /var/www/html/public/proof;
            fastcgi_pass php_fpm;
            fastcgi_read_timeout 90s;
        }

        location / {
            include /etc/nginx/fastcgi_params;
            fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
            fastcgi_param SCRIPT_NAME /index.php;
            fastcgi_param DOCUMENT_ROOT /var/www/html/public;
            fastcgi_pass php_fpm;
            fastcgi_read_timeout 90s;
        }
    }

    server {
        listen 8081;
        server_name _;
        client_max_body_size 32m;

        location = /calibration-hold.php {
            include /etc/nginx/fastcgi_params;
            fastcgi_param SCRIPT_FILENAME /var/www/html/public/calibration-hold.php;
            fastcgi_param DOCUMENT_ROOT /var/www/html/public;
            fastcgi_buffering off;
            fastcgi_pass php_fpm;
            fastcgi_read_timeout 1800s;
        }

        location = /body-leak.php {
            include /etc/nginx/fastcgi_params;
            fastcgi_param SCRIPT_FILENAME /var/www/html/public/body-leak.php;
            fastcgi_param DOCUMENT_ROOT /var/www/html/public;
            fastcgi_buffering off;
            fastcgi_pass php_fpm;
            fastcgi_read_timeout 90s;
        }

        location ~ ^/(?:plain|fpm-index|calibration-hold|body-leak)\.php$ {
            include /etc/nginx/fastcgi_params;
            fastcgi_param SCRIPT_FILENAME /var/www/html/public$fastcgi_script_name;
            fastcgi_param DOCUMENT_ROOT /var/www/html/public;
            fastcgi_pass php_fpm;
            fastcgi_read_timeout 90s;
        }

        location = /proof/shell.php {
            include /etc/nginx/fastcgi_params;
            fastcgi_param SCRIPT_FILENAME /var/www/html/public/proof/shell.php;
            fastcgi_param DOCUMENT_ROOT /var/www/html/public/proof;
            fastcgi_pass php_fpm;
            fastcgi_read_timeout 90s;
        }

        location / {
            include /etc/nginx/fastcgi_params;
            fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
            fastcgi_param SCRIPT_NAME /index.php;
            fastcgi_param DOCUMENT_ROOT /var/www/html/public;
            fastcgi_pass php_fpm;
            fastcgi_read_timeout 90s;
        }
    }
}
