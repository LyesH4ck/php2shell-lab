ServerName 127.0.0.1

<VirtualHost 127.0.0.1:8088>
    DocumentRoot /var/www/html/public
    DirectoryIndex index.php
    ErrorLog /tmp/php2shell-apache-error.log
    CustomLog /tmp/php2shell-apache-access.log combined

    <Directory /var/www/html/public>
        AllowOverride None
        Options -Indexes
        Require all granted
    </Directory>
</VirtualHost>

KeepAlive On
MaxKeepAliveRequests 100
KeepAliveTimeout 300

<IfModule mpm_prefork_module>
    StartServers ${PHP2SHELL_APACHE_WORKERS}
    MinSpareServers ${PHP2SHELL_APACHE_WORKERS}
    MaxSpareServers 17
    MaxRequestWorkers ${PHP2SHELL_APACHE_WORKERS}
    MaxConnectionsPerChild 0
</IfModule>
